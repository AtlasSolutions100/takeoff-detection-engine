<!doctype html>
<html lang="en" data-palette="core" data-accent="yellow">
<head>
<meta charset="utf-8">
<script src="/client.js?v=3"></script>
<title>Sign in &middot; CORE Takeoff</title>
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/favicon-180.png?v=3">
<meta name="theme-color" content="#0e1013">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Every asset this page needs has to be reachable BEFORE anyone is signed
     in. The page's own rules stay inline; the only other files are the
     palette (tokens.css) and the three Plex fonts it names, and all four are
     on server.py's _PUBLIC list. Every var() below carries the steel value as
     its fallback, so a blocked tokens.css still gives a dark, usable page. -->
<script>
  // Carry the look a signed-in user picked (Settings -> Appearance, this
  // browser) over to the sign-in page, before any CSS runs.
  (function () {
    var d = document.documentElement, p = null, t = null, a = null;
    try {
      p = localStorage.getItem("core-palette");
      t = localStorage.getItem("core-theme");
      a = localStorage.getItem("core-accent");
    } catch (e) { /* storage blocked: stay on the defaults */ }
    d.setAttribute("data-palette", p === "nightcrew" || p === "steel" ? p : "core");
    d.setAttribute("data-accent", a === "green" ? "green" : "yellow");
    d.setAttribute("data-theme", t === "light" ? "light" : "dark");
  })();
</script>
<link rel="stylesheet" href="/tokens.css">
<style>
  html { height: 100%; background: #0a0c0f; color: #e8eaed; color-scheme: dark; }
  html[data-palette="steel"] { background: #060c12; color: #e6eaee; }
  html[data-palette="nightcrew"] { background: #0d1012; }
  html[data-theme="light"] { background: #e4e1da; color: #1f2326; color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: var(--t-stage, #060c12); color: var(--t-text, #e6eaee);
    font: 14px/1.5 var(--t-font-ui, system-ui, -apple-system, "Segoe UI", sans-serif);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .beta {
    padding: 8px 16px; font-size: 12.5px; font-weight: 500; line-height: 1.45;
    color: var(--t-warn, #e5a33d); background: var(--t-surface-1, #0a1219);
    border-bottom: 1px solid var(--t-border, #1d2a36); text-align: center;
  }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; padding: 40px 16px 32px;
  }
  .card {
    width: 100%; max-width: 380px; padding: 28px 28px 24px;
    background: var(--t-surface-2, #0f1922);
    border: 1px solid var(--t-border, #1d2a36); border-radius: var(--t-r-3, 7px);
  }
  .wordmark { font-size: 20px; line-height: 1; letter-spacing: -.005em; }
  .wordmark b { font-weight: 700; }
  h1 { font-size: var(--t-fs-lg, 20px); font-weight: 600; line-height: 1.3; margin: 24px 0 20px; }
  label {
    display: block; margin: 0 0 6px;
    font-size: var(--t-fs-sm, 13px); font-weight: 500; color: var(--t-text-dim, #9aa8b6);
  }
  input {
    display: block; width: 100%; height: 40px; margin: 0 0 16px; padding: 0 12px;
    font: inherit; font-size: 15px; color: var(--t-text, #e6eaee);
    background: var(--t-field, #121e28);
    border: 1px solid var(--t-border-strong, #2b3c4b); border-radius: var(--t-r-1, 3px);
  }
  input:hover { border-color: var(--t-text-faint, #7d8b99); }
  /* focus in --t-accent-hi, the accent as a line on this ground: the plain
     accent is 1.6:1 on paper + yellow and the ring disappears */
  input:focus {
    outline: none; border-color: var(--t-accent-hi, #5ccb92);
    box-shadow: 0 0 0 1px var(--t-accent-hi, #5ccb92);
  }
  /* a saved password must not turn the field the browser's pale blue */
  input:-webkit-autofill, input:-webkit-autofill:hover {
    -webkit-text-fill-color: var(--t-text, #e6eaee);
    -webkit-box-shadow: 0 0 0 40px var(--t-field, #121e28) inset;
    caret-color: var(--t-text, #e6eaee);
  }
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--t-text, #e6eaee);
    -webkit-box-shadow: 0 0 0 40px var(--t-field, #121e28) inset, 0 0 0 1px var(--t-accent-hi, #5ccb92);
  }
  /* the one accent on the page - CORE green unless the user picked yellow.
     Text on it is --t-accent-ink: dark ink on green (5.7:1; white is
     2.97:1) and on yellow, white on the paper theme's deeper green. */
  button {
    display: block; width: 100%; height: 42px; margin-top: 4px; padding: 0 16px;
    font: 600 15px/1 var(--t-font-ui, system-ui, sans-serif);
    color: var(--t-accent-ink, #06210f); background: var(--t-accent, #3fa873);
    border: 0; border-radius: var(--t-r-2, 5px); cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:active { filter: brightness(.95); }
  button:focus-visible { outline: 2px solid var(--t-accent-hi, #5ccb92); outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: default; filter: none; }
  /* red text on the darker chrome ground: >= 4.8:1 in all three palettes */
  .err {
    display: none; margin: 0 0 16px; padding: 10px 12px;
    font-size: 13.5px; line-height: 1.45;
    color: var(--t-stop, #e5533d); background: var(--t-surface-1, #0a1219);
    border: 1px solid var(--t-stop, #e5533d);
    border-color: color-mix(in srgb, var(--t-stop, #e5533d) 55%, transparent);
    border-radius: var(--t-r-2, 5px);
  }
  .err.show { display: block; }
  .foot {
    margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--t-border, #1d2a36);
    font-size: var(--t-fs-sm, 13px); line-height: 1.6; color: var(--t-text-dim, #9aa8b6);
  }
  a {
    color: var(--t-text, #e6eaee); text-decoration: underline;
    text-decoration-color: var(--t-text-faint, #7d8b99); text-underline-offset: 3px;
  }
  a:hover { text-decoration-color: var(--t-text, #e6eaee); }
  a:focus-visible { outline: 2px solid var(--t-accent-hi, #5ccb92); outline-offset: 2px; border-radius: 2px; }
  .page-foot {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0 12px;
    font-size: var(--t-fs-sm, 13px);
  }
  .page-foot a { padding: 6px 4px; color: var(--t-text-dim, #9aa8b6); text-decoration: none; }
  .page-foot a:hover { color: var(--t-text, #e6eaee); text-decoration: underline; }
</style>
</head>
<body>
<div class="beta">Automated detection can be wrong. Double-check every quantity against the drawings.</div>
<main>
  <div class="card">
    <div class="wordmark"><b>CORE</b> Takeoff</div>
    <h1>Sign in</h1>
    <p class="err" id="err"></p>
    <form id="f" autocomplete="on">
      <label for="u">Email</label>
      <!-- type=email would block a bare username on a box with no users.json,
           where any name plus the site password is valid. -->
      <input id="u" name="username" type="text" autocomplete="username"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password"
             autocomplete="current-password" required>
      <button id="go" type="submit">Sign in</button>
    </form>
    <p class="foot">Trouble signing in? Ask Koby or Christian to reset it.<br>
      By signing in you accept the <a href="/terms">Terms of Service</a>
      and <a href="/privacy">Privacy Policy</a>.</p>
  </div>
  <nav class="page-foot" aria-label="About CORE Takeoff">
    <a href="/welcome">What is CORE Takeoff?</a>
    <a href="/terms">Terms</a>
    <a href="/privacy">Privacy</a>
  </nav>
</main>
<script>
  const f = document.getElementById("f");
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  const show = (m) => { err.textContent = m; err.classList.add("show"); };

  f.onsubmit = async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    go.disabled = true;
    go.textContent = "Signing in…";
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("u").value,
          password: document.getElementById("p").value,
        }),
      });
      if (r.ok) {
        // Whatever page they were sent here from, else the app root.
        const to = new URLSearchParams(location.search).get("next") || "/";
        // Keep the fragment. A link from Bid Sniper is <root>/#bid=<id> (or
        // #job=<id>); the server never sees a fragment, so the redirect to
        // /login?next=/ carried it here on the login URL, and dropping it
        // would land the person on Projects with the hand-off lost.
        const dest = to.startsWith("/") ? to : "/";
        location.href = dest.includes("#") ? dest : dest + (location.hash || "");
        return;
      }
      const j = await r.json().catch(() => ({}));
      show(j.detail || `Could not sign in (${r.status})`);
    } catch (e) {
      show("Could not reach the server. Check your connection and try again.");
    }
    go.disabled = false;
    go.textContent = "Sign in";
  };
  document.getElementById("u").focus();
</script>
</body>
</html>
