<!doctype html>
<html lang="en" data-palette="core" data-accent="yellow">
<head>
<meta charset="utf-8">
<script src="/client.js?v=3"></script>
<title>Choose a password &middot; CORE Takeoff</title>
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/favicon-180.png?v=3">
<meta name="theme-color" content="#0e1013">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Like the login page: this has to render for someone who is signed in
     but not yet allowed to touch anything else. Its rules stay inline; the
     palette (tokens.css) and the Plex fonts are on server.py's _PUBLIC list,
     which the must-change gate lets through. Every var() carries the steel
     value as its fallback, so a blocked tokens.css still gives a dark page. -->
<script>
  // Carry the look a signed-in user picked (Settings -> Appearance, this
  // browser) over, before any CSS runs.
  (function () {
    var d = document.documentElement, p = null, t = null, a = null;
    try {
      p = localStorage.getItem("core-palette");
      t = localStorage.getItem("core-theme");
      a = localStorage.getItem("core-accent");
    } catch (e) { /* storage blocked: stay on the defaults */ }
    d.setAttribute("data-palette", p === "nightcrew" || p === "steel" ? p : "core");
    d.setAttribute("data-accent", a === "green" ? "green" : "yellow");
    d.setAttribute("data-theme", t === "light" ? "light" : "dark");
  })();
</script>
<link rel="stylesheet" href="/tokens.css">
<style>
  html { height: 100%; background: #0a0c0f; color: #e8eaed; color-scheme: dark; }
  html[data-palette="steel"] { background: #060c12; color: #e6eaee; }
  html[data-palette="nightcrew"] { background: #0d1012; }
  html[data-theme="light"] { background: #e4e1da; color: #1f2326; color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: var(--t-stage, #060c12); color: var(--t-text, #e6eaee);
    font: 14px/1.5 var(--t-font-ui, system-ui, -apple-system, "Segoe UI", sans-serif);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .beta {
    padding: 8px 16px; font-size: 12.5px; font-weight: 500; line-height: 1.45;
    color: var(--t-warn, #e5a33d); background: var(--t-surface-1, #0a1219);
    border-bottom: 1px solid var(--t-border, #1d2a36); text-align: center;
  }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; padding: 40px 16px 32px;
  }
  .card {
    width: 100%; max-width: 400px; padding: 28px 28px 24px;
    background: var(--t-surface-2, #0f1922);
    border: 1px solid var(--t-border, #1d2a36); border-radius: var(--t-r-3, 7px);
  }
  .wordmark { font-size: 20px; line-height: 1; letter-spacing: -.005em; }
  .wordmark b { font-weight: 700; }
  h1 { font-size: var(--t-fs-lg, 20px); font-weight: 600; line-height: 1.3; margin: 24px 0 8px; }
  .why { font-size: var(--t-fs-sm, 13px); line-height: 1.55; color: var(--t-text-dim, #9aa8b6); margin: 0 0 20px; }
  label {
    display: block; margin: 0 0 6px;
    font-size: var(--t-fs-sm, 13px); font-weight: 500; color: var(--t-text-dim, #9aa8b6);
  }
  input {
    display: block; width: 100%; height: 40px; margin: 0 0 16px; padding: 0 12px;
    font: inherit; font-size: 15px; color: var(--t-text, #e6eaee);
    background: var(--t-field, #121e28);
    border: 1px solid var(--t-border-strong, #2b3c4b); border-radius: var(--t-r-1, 3px);
  }
  input::placeholder { color: var(--t-text-faint, #7d8b99); opacity: 1; }
  input:hover { border-color: var(--t-text-faint, #7d8b99); }
  /* focus in --t-accent-hi, the accent as a line on this ground: the plain
     accent is 1.6:1 on paper + yellow and the ring disappears */
  input:focus {
    outline: none; border-color: var(--t-accent-hi, #5ccb92);
    box-shadow: 0 0 0 1px var(--t-accent-hi, #5ccb92);
  }
  input:-webkit-autofill, input:-webkit-autofill:hover {
    -webkit-text-fill-color: var(--t-text, #e6eaee);
    -webkit-box-shadow: 0 0 0 40px var(--t-field, #121e28) inset;
    caret-color: var(--t-text, #e6eaee);
  }
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--t-text, #e6eaee);
    -webkit-box-shadow: 0 0 0 40px var(--t-field, #121e28) inset, 0 0 0 1px var(--t-accent-hi, #5ccb92);
  }
  /* the one accent on the page; its text colour is --t-accent-ink */
  button {
    display: block; width: 100%; height: 42px; margin-top: 4px; padding: 0 16px;
    font: 600 15px/1 var(--t-font-ui, system-ui, sans-serif);
    color: var(--t-accent-ink, #06210f); background: var(--t-accent, #3fa873);
    border: 0; border-radius: var(--t-r-2, 5px); cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:active { filter: brightness(.95); }
  button:focus-visible { outline: 2px solid var(--t-accent-hi, #5ccb92); outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: default; filter: none; }
  .err, .hint {
    display: none; margin: 0 0 16px; padding: 10px 12px;
    font-size: 13.5px; line-height: 1.45;
    background: var(--t-surface-1, #0a1219);
    border: 1px solid var(--t-border, #1d2a36); border-radius: var(--t-r-2, 5px);
  }
  /* red text on the darker chrome ground: >= 4.8:1 in all three palettes */
  .err {
    color: var(--t-stop, #e5533d);
    border-color: var(--t-stop, #e5533d);
    border-color: color-mix(in srgb, var(--t-stop, #e5533d) 55%, transparent);
  }
  .hint { color: var(--t-text-dim, #9aa8b6); }
  .err.show, .hint.show { display: block; }
  .foot {
    margin: 16px 0 0; font-size: var(--t-fs-sm, 13px); color: var(--t-text-dim, #9aa8b6);
  }
  .foot:empty { display: none; }
  a:focus-visible { outline: 2px solid var(--t-accent-hi, #5ccb92); outline-offset: 2px; border-radius: 2px; }
  .page-foot {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0 12px;
    font-size: var(--t-fs-sm, 13px);
  }
  .page-foot a { padding: 6px 4px; color: var(--t-text-dim, #9aa8b6); text-decoration: none; }
  .page-foot a:hover { color: var(--t-text, #e6eaee); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="beta">Automated detection can be wrong. Double-check every quantity against the drawings.</div>
<main>
  <div class="card">
    <div class="wordmark"><b>CORE</b> Takeoff</div>
    <h1>Choose your password</h1>
    <!-- True in both cases until /api/me says which one this is: a forced
         first change after staff issued a one-time password (must_change),
         or a change the user chose to make. -->
    <p class="why" id="why">
      Pick a new password for your account. Use at least 8 characters.
    </p>
    <p class="err" id="err"></p>
    <form id="f">
      <label for="p1">New password</label>
      <input id="p1" type="password" autocomplete="new-password" required
             minlength="8" placeholder="at least 8 characters">
      <label for="p2">Confirm</label>
      <input id="p2" type="password" autocomplete="new-password" required
             minlength="8">
      <button id="go" type="submit">Save and continue</button>
    </form>
    <p class="foot" id="who"></p>
  </div>
  <nav class="page-foot" aria-label="About CORE Takeoff">
    <a href="/welcome">What is CORE Takeoff?</a>
    <a href="/terms">Terms</a>
    <a href="/privacy">Privacy</a>
  </nav>
</main>
<script>
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  const show = (m) => { err.textContent = m; err.classList.add("show"); };

  fetch("/api/me").then(r => r.ok ? r.json() : null).then(m => {
    if (m && m.user) document.getElementById("who").textContent = "Signed in as " + m.user;
    if (!m || !m.user) return;
    // the server says which case this is (users.must_change): say only what is true for it
    document.getElementById("why").textContent = m.must_change
      ? "You signed in with a one-time password that was given to you. "
        + "Until you change it, anyone who knows it could open your account "
        + "and see your plans. Pick your own to go on."
      : "Pick a new password for your account. Use at least 8 characters. "
        + "When you save it, you stay signed in here and are signed out "
        + "everywhere else.";
  }).catch(() => {});

  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    const p1 = document.getElementById("p1").value;
    const p2 = document.getElementById("p2").value;
    // Check here as well as on the server: a mismatch caught in the browser
    // saves a round trip, and the server checks again because this one is
    // only a convenience.
    if (p1 !== p2) return show("Those two do not match.");
    if (p1.length < 8) return show("Use at least 8 characters.");
    go.disabled = true;
    go.textContent = "Saving…";
    try {
      const r = await fetch("/api/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: p1 }),
      });
      if (r.ok) { location.href = "/"; return; }
      const j = await r.json().catch(() => ({}));
      show(j.detail || `Could not save it (${r.status})`);
    } catch (e) {
      show("Could not reach the server. Try again.");
    }
    go.disabled = false;
    go.textContent = "Save and continue";
  };
  document.getElementById("p1").focus();
</script>
</body>
</html>
